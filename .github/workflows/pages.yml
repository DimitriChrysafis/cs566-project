name: pages

# site deploys via ./publish.sh -> gh-pages branch (Pages source: gh-pages).
# this workflow is kept manual-only; re-enable push trigger if the account
# returns to actions-based deploys (build_type workflow).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webpage
      - id: deployment
        uses: actions/deploy-pages@v4
